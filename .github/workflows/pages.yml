name: pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and audit
        run: python3 site.py
      - name: Refuse a custom domain and confirm a clean rebuild
        run: |
          test ! -e CNAME
          test ! -e site/CNAME
          git diff --exit-code

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a custom domain
        run: |
          test ! -e CNAME
          test ! -e site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
